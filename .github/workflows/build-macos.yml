name: 构建 macOS 安装包

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 macOS DMG
    runs-on: macos-14
    # Tauri updater 在生成 .app.tar.gz 时会从当前构建进程读取签名私钥。
    # 该工作流直接运行 bun，因此必须在 job/step 环境中显式注入这两个 Secret。
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 校验 Tauri 签名私钥
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY 未注入当前 job。请确认它是 Settings → Secrets and variables → Actions 下的 Repository secret。"
            exit 1
          fi

          test_file="$RUNNER_TEMP/tauri-signing-preflight.txt"
          printf 'tauri updater signing preflight\n' > "$test_file"
          bun tauri signer sign "$test_file"

      - name: 构建 Tauri 安装包
        run: bun run tauri build

      - name: 上传 macOS 构件
        uses: actions/upload-artifact@v4
        with:
          name: octopus-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
