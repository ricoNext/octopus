name: 构建 macOS 安装包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 构建 macOS DMG
    runs-on: macos-14

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 校验发布标签与应用版本
        if: github.ref_type == 'tag'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "标签 $TAG 与 package.json 中的版本 $VERSION 不一致" >&2
            exit 1
          fi

      - name: 安装前端依赖
        run: bun install --frozen-lockfile

      - name: 构建 Tauri 安装包
        run: bun run tauri build

      - name: 上传 macOS 构件
        uses: actions/upload-artifact@v4
        with:
          name: octopus-macos-${{ github.sha }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app

      - name: 提取 Release 说明
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found=1 }
            found && index($0, "## [") == 1 && index($0, "## [" version "]") != 1 { exit }
            found { print }
          ' changelog.md > release-notes.md

      - name: 创建 GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: octopus ${{ github.ref_name }}
          body_path: release-notes.md
          files: src-tauri/target/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true
